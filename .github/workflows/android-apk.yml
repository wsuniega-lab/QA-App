# Builds an installable Android APK and attaches it to a GitHub Release.
# Download it on the phone from the repository's Releases page.
name: Build Android APK

on:
  push:
    branches: [main, claude/precast-concrete-qa-app-s6adqt]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Release build signed with the default debug key: fine for installing
      # directly on your own phones, not for the Play Store. Only arm64 is
      # built, which covers modern Android phones and halves build time.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PrecastQA.apk
          gh release create "android-build-${{ github.run_number }}" PrecastQA.apk \
            --target "${{ github.sha }}" \
            --title "Precast QA for Android (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone, tap **PrecastQA.apk** to download it, then open the file to install. Built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}." \
            --latest
